services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: biblioagent
      POSTGRES_PASSWORD: biblioagent
      POSTGRES_DB: biblioagent
    ports:
      - "5432:5432"
    volumes:
      - biblioagent_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U biblioagent"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  biblioagent_pgdata:
